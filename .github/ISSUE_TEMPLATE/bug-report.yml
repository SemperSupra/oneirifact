name: "Bug report"
description: "Report a reproducible problem in a publicly available Oneirifact build."
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Describe only the public or local build you actually tested.
        Do not upload confidential project graphs, credentials, private repositories, personal information, or protected assets.
        The public showcase is not yet the procedural editor; select the relevant surface below.
  - type: dropdown
    id: surface
    attributes:
      label: Product surface
      options:
        - "Public project showcase"
        - "Interactive browser editor (when released)"
        - "Locally built editor or CLI"
        - "Other or unsure"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: "Optional; use the public release version or public commit if available."
      placeholder: "e.g., v0.6.0-preview or a public commit"
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      description: "Optional; include only non-identifying technical details."
      placeholder: "e.g., Firefox on Linux"
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: "Use a harmless synthetic example if a project is involved."
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-information check
      options:
        - label: "I have removed credentials, personal information, confidential files, private project data, and protected content."
          required: true
