name: "Feature request"
description: "Suggest a bounded, useful improvement to the public Oneirifact experience."
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Oneirifact explores editable procedural 3D design for people, automation, and agents.
        Please describe the user goal, not private architecture, source code, protected datasets, or secrets.
        An unannounced capability should not be assumed to be available in the public preview.
  - type: dropdown
    id: audience
    attributes:
      label: Who would use this?
      options:
        - "Person using the graphical editor"
        - "Person using a keyboard or assistive technology"
        - "Deterministic automation / CLI / API"
        - "Agent using a typed interface"
        - "Several of these"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What do you want to accomplish?
      description: "Describe the task and expected outcome."
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: How do you accomplish it now?
      description: "Optional, including workarounds."
  - type: textarea
    id: proposed
    attributes:
      label: Desired behavior
      description: "Suggestions are welcome; no implementation details required."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-information check
      options:
        - label: "I have removed credentials, confidential projects, personal information, and other non-public material."
          required: true
