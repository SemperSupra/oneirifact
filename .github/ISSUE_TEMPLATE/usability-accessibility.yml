name: "Usability and accessibility feedback"
description: "Describe a usability or accessibility barrier in Oneirifact."
title: "[UX] "
body:
  - type: markdown
    attributes:
      value: |
        Feedback about navigation, keyboard support, readable controls and assistive technology is welcome.
        You do not need to disclose a disability, identity, medical condition, or private information.
        Avoid private projects or protected assets in attachments and examples.
  - type: dropdown
    id: surface
    attributes:
      label: Product surface
      options:
        - "Public project showcase"
        - "Interactive browser editor (when released)"
        - "Local editor or CLI"
        - "Other or unsure"
    validations:
      required: true
  - type: dropdown
    id: interaction
    attributes:
      label: Interaction method
      options:
        - "Keyboard"
        - "Pointer or touch"
        - "Screen reader or other assistive technology"
        - "Visual layout, contrast or text scaling"
        - "Automation or typed interface"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: "Describe the task without including private source or identifying information."
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: Where did the experience become difficult?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: What would make this easier?
      description: "Optional suggestions are welcome."
  - type: input
    id: environment
    attributes:
      label: Browser, device or interaction environment
      description: "Optional; include only what is useful and comfortable to share."
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-information check
      options:
        - label: "I have removed private files, credentials, personal information and protected project content."
          required: true
