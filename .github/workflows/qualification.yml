name: Public delivery prerequisites

on:
  push:
    branches: [qualification/browser-delivery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.23.2'
          cache: false
      - run: python3 qualification/worker_http.py
  scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify pinned scanner archive and exercise synthetic controls
        run: |
          set -eu
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 90 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          mkdir -m 700 "$RUNNER_TEMP/scanner"
          tar -xzf "$archive" -C "$RUNNER_TEMP/scanner" gitleaks
          test -f "$RUNNER_TEMP/scanner/gitleaks"
          test ! -L "$RUNNER_TEMP/scanner/gitleaks"
          "$RUNNER_TEMP/scanner/gitleaks" version
          sha256sum "$RUNNER_TEMP/scanner/gitleaks"
          python3 qualification/scanner_probe.py "$RUNNER_TEMP/scanner/gitleaks"
