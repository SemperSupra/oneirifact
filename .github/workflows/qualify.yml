name: Qualify public showcase

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: public-showcase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      manifest_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Checkout public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Qualify pinned independent secret scanner and scan public source
        run: |
          set -eu
          work="$(mktemp -d "$RUNNER_TEMP/secret-scan.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 2 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$work/scanner.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $work/scanner.tar.gz" | sha256sum -c -
          tar -xOf "$work/scanner.tar.gz" gitleaks > "$work/gitleaks"
          chmod 0700 "$work/gitleaks"
          echo "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509  $work/gitleaks" | sha256sum -c -
          "$work/gitleaks" version
          python3 tests/scan_public_source.py "$work/gitleaks" --commit "$(git rev-parse HEAD)"
      - name: Obtain pinned Blender and build matching visual gallery
        run: |
          set -euo pipefail
          artifact=blender-5.2.4-linux-x64.tar.xz
          expected=2fd14c50987426897ba60237ee996edf2b4151f4b1a72a460ca20be58c1d2d86
          root="$RUNNER_TEMP/native-blender"
          install -d -m 700 "$root"
          verified=0
          for origin in https://download.blender.org https://mirror.blender.org https://mirror.nju.edu.cn/blender; do
            rm -f "$root/$artifact"
            if timeout 110s curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --connect-timeout 12 --speed-limit 32768 --speed-time 12 --max-time 95 "$origin/release/Blender5.2/$artifact" -o "$root/$artifact"; then
              echo "$expected  $root/$artifact" | sha256sum -c -
              verified=1
              break
            fi
          done
          test "$verified" -eq 1
          timeout 150s tar -xf "$root/$artifact" -C "$root"
          python3 gallery/build_gallery.py "$root/blender-5.2.4-linux-x64/blender"
      - name: Retain qualified gallery renders and models
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-gallery-renders-and-models
          path: site/gallery
          retention-days: 30
          if-no-files-found: error
      - name: Build static artifact inspector with verified upstream viewer dependencies
        run: python3 gallery/build_inspector.py
      - name: Retain exact inspector pages and dependency lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: artifact-inspector
          path: site/inspect
          retention-days: 30
          if-no-files-found: error
      - name: Build compact anatomical reference explorer
        env:
          GH_TOKEN: ${{ github.token }}
          OPENBLAS_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/anatomy-input"
          for row in 'male 15238389268' 'female 15238269509' 'regional 15249571443' 'pineal 15251480567' 'identity 15251349301' 'registration 15252200930'; do
            read -r name id <<< "$row"
            gh api repos/SemperSupra/oneirifact/actions/artifacts/$id/zip > "$RUNNER_TEMP/anatomy-input/$name.zip"
          done
          python3 -m venv "$RUNNER_TEMP/anatomy-venv"
          source "$RUNNER_TEMP/anatomy-venv/bin/activate"
          pip install numpy==2.3.5 trimesh==4.6.8 fast-simplification==0.1.13
          python gallery/build_anatomy.py "$RUNNER_TEMP/anatomy-input"
      - name: Verify public repository and static site
        run: |
          set -eu
          test "${{ github.event.repository.private }}" = "false"
          python3 -m unittest discover -s tests -v
          python3 tests/smoke_site.py
          node tests/smoke_inspector.mjs
          node tests/smoke_anatomy.mjs
      - name: Retain anatomy browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anatomy-browser-witnesses
          path: ${{ runner.temp }}/anatomy-*.png
          retention-days: 30
          if-no-files-found: ignore
      - name: Retain browser reference asset pack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anatomy-display-assets
          path: site/anatomy/data
          retention-days: 30
          if-no-files-found: error
      - name: Stage and hash every qualified asset
        id: digest
        run: |
          set -eu
          digest="$(python3 tests/verify_delivery.py stage site "$RUNNER_TEMP/qualified-site")"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Upload qualified static site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/qualified-site
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact qualified public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject superseded source
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -eu
          current="$(git ls-remote https://github.com/SemperSupra/oneirifact.git refs/heads/main | cut -f 1)"
          test "$current" = "$EXPECTED"
      - name: Deploy qualified public artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Verify live manifest and every asset
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED: ${{ needs.qualify.outputs.manifest_sha256 }}
        run: |
          set -eu
          test "${PAGE_URL%/}/" = "https://sempersupra.github.io/oneirifact/"
          for attempt in $(seq 1 10); do
            if python3 tests/verify_delivery.py verify "$EXPECTED"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Live assets did not match the qualified artifact"
          exit 1
