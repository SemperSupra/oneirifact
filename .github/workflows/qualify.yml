name: Qualify public showcase

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-showcase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      manifest_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Checkout public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Qualify pinned independent secret scanner and scan public source
        run: |
          set -eu
          work="$(mktemp -d "$RUNNER_TEMP/secret-scan.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 2 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$work/scanner.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $work/scanner.tar.gz" | sha256sum -c -
          tar -xOf "$work/scanner.tar.gz" gitleaks > "$work/gitleaks"
          chmod 0700 "$work/gitleaks"
          echo "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509  $work/gitleaks" | sha256sum -c -
          "$work/gitleaks" version
          python3 tests/scan_public_source.py "$work/gitleaks" --commit "$(git rev-parse HEAD)"
      - name: Verify public repository and static site
        run: |
          set -eu
          test "${{ github.event.repository.private }}" = "false"
          python3 -m unittest discover -s tests -v
          python3 tests/smoke_site.py
      - name: Stage and hash every qualified asset
        id: digest
        run: |
          set -eu
          digest="$(python3 tests/verify_delivery.py stage site "$RUNNER_TEMP/qualified-site")"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Upload qualified static site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/qualified-site
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact qualified public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject superseded source
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -eu
          current="$(git ls-remote https://github.com/SemperSupra/oneirifact.git refs/heads/main | cut -f 1)"
          test "$current" = "$EXPECTED"
      - name: Deploy qualified public artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Verify live manifest and every asset
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED: ${{ needs.qualify.outputs.manifest_sha256 }}
        run: |
          set -eu
          test "${PAGE_URL%/}/" = "https://sempersupra.github.io/oneirifact/"
          for attempt in $(seq 1 10); do
            if python3 tests/verify_delivery.py verify "$EXPECTED"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Live assets did not match the qualified artifact"
          exit 1
