name: R255 versioned public motion display packs
on:
  pull_request:
    branches: [main]
    paths: ['gallery/build_motion_extensions.py','gallery/motion-extension-inputs.json','gallery/motion-extension-release-lock.json','gallery/motion_pack.py','.github/workflows/r255-motion-release.yml']
  push:
    branches: [main]
    paths: ['gallery/build_motion_extensions.py','gallery/motion-extension-inputs.json','gallery/motion-extension-release-lock.json','gallery/motion_pack.py','.github/workflows/r255-motion-release.yml']
permissions:
  contents: read
  actions: read
jobs:
  qualify-pack:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pack: [r255-support-events-v2, r255-acrobatics-combat-v2, r255-exercise-dance-v2]
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PACK_ID: ${{ matrix.pack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Preserve exact source files and failed or held scientific dispositions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          python3 gallery/build_motion_extensions.py --archives "$RUNNER_TEMP/archives" --out "$RUNNER_TEMP/display-packs" --only "$PACK_ID"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          recorded=json.loads(Path('gallery/motion-extension-release-lock.json').read_text())['packs']
          built=json.loads((Path(os.environ['RUNNER_TEMP'])/'display-packs/extension-release-lock.json').read_text())['packs']
          assert built==[r for r in recorded if r['pack_id']==os.environ['PACK_ID']]
          print('R255_EXACT_DISPLAY_LOCK_PASS',os.environ['PACK_ID'])
          PY
          python3 gallery/restore_motion_release.py --lock "$RUNNER_TEMP/display-packs/extension-release-lock.json" --source "$RUNNER_TEMP/display-packs/$PACK_ID/$PACK_ID.zip" --dest "$RUNNER_TEMP/restored/data"
      - name: Retain pack, source-byte proof and negative controls
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 Node24
        with:
          name: r255-display-${{ matrix.pack }}
          path: |
            ${{ runner.temp }}/display-packs/${{ matrix.pack }}/*.zip
            ${{ runner.temp }}/display-packs/${{ matrix.pack }}/intake-receipt.json
            ${{ runner.temp }}/display-packs/${{ matrix.pack }}/release-lock.json
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: qualify-pack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pack: [r255-support-events-v2, r255-acrobatics-combat-v2, r255-exercise-dance-v2]
    env:
      GH_TOKEN: ${{ github.token }}
      PACK_ID: ${{ matrix.pack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish versioned files once and verify anonymous exact readback
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "r255-display-$PACK_ID" --dir "$RUNNER_TEMP/publish"
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'gallery')
          import motion_pack
          entry=next(r for r in json.loads(Path('gallery/motion-extension-release-lock.json').read_text())['packs'] if r['pack_id']==os.environ['PACK_ID'])
          actual=json.loads((Path(os.environ['RUNNER_TEMP'])/'publish/release-lock.json').read_text())
          assert actual==entry
          motion_pack.verify(Path(os.environ['RUNNER_TEMP'])/'publish'/entry['asset'],entry['sha256'])
          PY
          if ! gh release view "$PACK_ID" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$PACK_ID" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Motion research studies $PACK_ID" --notes "Versioned, SHA-256-pinned display pack of exact R255 v2 authored source products. All original producer files are retained byte-for-byte, including failed or held contact diagnostics. Geometry transport does not qualify realism, technique, contact or physics. Original rendered previews, native scenes, models, notices and measured fitting residuals are included. The display catalog normalizes provider provenance; no product geometry, animation or media is changed." --latest=false "$RUNNER_TEMP/publish/$PACK_ID.zip" "$RUNNER_TEMP/publish/intake-receipt.json" "$RUNNER_TEMP/publish/release-lock.json"
          fi
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 180 --max-filesize 268435456 "https://github.com/$GITHUB_REPOSITORY/releases/download/$PACK_ID/$PACK_ID.zip" -o "$RUNNER_TEMP/readback.zip"
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,'gallery')
          import motion_pack
          entry=next(r for r in json.loads(Path('gallery/motion-extension-release-lock.json').read_text())['packs'] if r['pack_id']==os.environ['PACK_ID'])
          motion_pack.verify(Path(os.environ['RUNNER_TEMP'])/'readback.zip',entry['sha256'])
          print('R255_ANONYMOUS_DISPLAY_RELEASE_READBACK_PASS',entry['pack_id'],entry['sha256'])
          PY
