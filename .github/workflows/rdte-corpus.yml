name: Qualify open model corpus
on:
  pull_request:
    branches: [main]
    paths: ['experiments/corpus/**', '.github/workflows/rdte-corpus.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transform:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        asset: [Avocado, Lantern, WaterBottle]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Obtain pinned Blender
        run: |
          set -euo pipefail
          artifact=blender-5.2.4-linux-x64.tar.xz
          expected=2fd14c50987426897ba60237ee996edf2b4151f4b1a72a460ca20be58c1d2d86
          root="$RUNNER_TEMP/native-blender"
          install -d -m 700 "$root"
          verified=0
          for origin in https://download.blender.org https://mirror.blender.org https://mirror.nju.edu.cn/blender; do
            rm -f "$root/$artifact"
            if timeout 110s curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --connect-timeout 12 --speed-limit 32768 --speed-time 12 --max-time 95 "$origin/release/Blender5.2/$artifact" -o "$root/$artifact"; then
              echo "$expected  $root/$artifact" | sha256sum -c -
              verified=1
              break
            fi
          done
          test "$verified" -eq 1
          timeout 150s tar -xf "$root/$artifact" -C "$root"
          echo "BLENDER=$root/blender-5.2.4-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Anonymously acquire pinned CC0 model and rights record
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          case "$ASSET" in Avocado|Lantern|WaterBottle) ;; *) exit 1;; esac
          install -d -m 700 "$RUNNER_TEMP/corpus"
          base="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/e124e8d8d7330a5372bc2b4d00d39a4a9d7997ea/Models/$ASSET"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 60 --max-filesize 20971520 "$base/glTF-Binary/$ASSET.glb" -o "$RUNNER_TEMP/corpus/source.glb"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 30 --max-filesize 65536 "$base/README.md" -o "$RUNNER_TEMP/corpus/source-rights.md"
          grep -q 'creativecommons.org/publicdomain/zero/1.0/legalcode' "$RUNNER_TEMP/corpus/source-rights.md"
          printf '%s\n' "$base/glTF-Binary/$ASSET.glb" > "$RUNNER_TEMP/corpus/source-url.txt"
      - name: Import, fit, deform and render actual model
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          timeout 180s "$BLENDER" --background --factory-startup --disable-autoexec -t 2 --python-exit-code 1 --python experiments/corpus/transform.py -- "$RUNNER_TEMP/corpus/source.glb" "$RUNNER_TEMP/corpus" "$ASSET"
          python3 - "$RUNNER_TEMP/corpus" <<'PY'
          import sys,json,hashlib,struct
          from pathlib import Path
          p=Path(sys.argv[1]);r=json.loads((p/'receipt.json').read_text())
          assert r['vertices'] == r['deformed_vertices_processed'] > 0
          for name,digest in r['files'].items():assert hashlib.sha256((p/name).read_bytes()).hexdigest()==digest
          assert (p/'normalized.glb').read_bytes() != (p/'deformed.glb').read_bytes()
          assert struct.unpack('>II',(p/'comparison.png').read_bytes()[16:24])==(840,480)
          print('CORPUS_ARTIFACT_PASS',r['asset'],r['primitive'])
          PY
      - name: Retain source and derived models and render
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corpus-${{ matrix.asset }}
          path: ${{ runner.temp }}/corpus
          retention-days: 30
          if-no-files-found: error
