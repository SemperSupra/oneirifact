name: Qualify inverse CSG sequencing bakeoff
on:
  pull_request:
    branches: [main, rdte/r201-topology-gated-inverse-fit]
    paths: ['experiments/inverse-r203/**', '.github/workflows/rdte-inverse-r203.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inverse-r203-${{ github.ref }}
  cancel-in-progress: false
jobs:
  csg:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin research environment and run actual sequencing bakeoff
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install numpy==2.3.5 scipy==1.17.0 Pillow==12.0.0
          python experiments/inverse-r203/sequence_bakeoff.py "$RUNNER_TEMP/r203"
      - name: Retain all models, construction programs and visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r203-csg-sequence-bakeoff
          path: ${{ runner.temp }}/r203
          retention-days: 30
          if-no-files-found: error
