name: Qualify mechanical bearing study
on:
  pull_request:
    branches: [main]
    paths: ['experiments/mechanical/**', '.github/workflows/rdte-mechanical.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Obtain pinned Blender
        run: |
          set -euo pipefail
          artifact=blender-5.2.4-linux-x64.tar.xz
          expected=2fd14c50987426897ba60237ee996edf2b4151f4b1a72a460ca20be58c1d2d86
          root="$RUNNER_TEMP/native-blender"
          install -d -m 700 "$root"
          verified=0
          for origin in https://download.blender.org https://mirror.blender.org https://mirror.nju.edu.cn/blender; do
            rm -f "$root/$artifact"
            if timeout 110s curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --connect-timeout 12 --speed-limit 32768 --speed-time 12 --max-time 95 "$origin/release/Blender5.2/$artifact" -o "$root/$artifact"; then
              echo "$expected  $root/$artifact" | sha256sum -c -
              verified=1
              break
            fi
          done
          test "$verified" -eq 1
          timeout 150s tar -xf "$root/$artifact" -C "$root"
          echo "BLENDER=$root/blender-5.2.4-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Render and export assembled and exploded study
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/mechanical-proof"
          for profile in assembled exploded; do
            timeout 120s "$BLENDER" --background --factory-startup --disable-autoexec -t 2 --python-exit-code 1 --python experiments/mechanical/bearing.py -- "$profile" "$RUNNER_TEMP/mechanical-proof"
          done
          python3 experiments/mechanical/verify.py "$RUNNER_TEMP/mechanical-proof" "$BLENDER"
      - name: Retain actual images models and receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mechanical-bearing-study
          path: ${{ runner.temp }}/mechanical-proof
          retention-days: 30
          if-no-files-found: error
