name: Qualify functional module references
on:
  pull_request:
    branches: [main]
    paths: ['experiments/r207/**', '.github/workflows/rdte-r207.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  witness:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        lane: [snap, behavior]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute bounded standard library reference
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          go version
          go run "experiments/r207/$LANE/main.go" "$RUNNER_TEMP/witness"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r207-${{ matrix.lane }}
          path: ${{ runner.temp }}/witness
          retention-days: 30
          if-no-files-found: error
