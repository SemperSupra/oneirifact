name: Thin geometry meshing fidelity bakeoff
on:
  pull_request:
    branches: [main]
    paths: ['experiments/r213/**', '.github/workflows/rdte-r213.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        fixture: [disk, shell]
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute bounded numerical mesh comparison
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install numpy==2.3.5 scipy==1.17.0 scikit-image==0.26.0 Pillow==12.0.0
          python experiments/r213/meshing_bakeoff.py "$FIXTURE" "$RUNNER_TEMP/r213"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r213-${{ matrix.fixture }}
          path: ${{ runner.temp }}/r213
          retention-days: 30
          if-no-files-found: error
