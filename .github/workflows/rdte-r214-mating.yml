name: LDraw reference mating diagnostics
on:
  pull_request:
    branches: [main]
    paths: ['experiments/r214/**', '.github/workflows/rdte-r214-mating.yml']
permissions:
  contents: read
  actions: read
jobs:
  mating:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retrieve verified R208 reference geometry
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/SemperSupra/oneirifact/actions/artifacts/15232521230/zip > "$RUNNER_TEMP/reference.zip"
      - name: Execute nominal and misaligned assembly section diagnostic
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install numpy==2.3.5 Pillow==12.0.0
          python experiments/r214/mating_sections.py "$RUNNER_TEMP/reference.zip" "$RUNNER_TEMP/r214"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r214-mating
          path: ${{ runner.temp }}/r214
          retention-days: 30
          if-no-files-found: error
