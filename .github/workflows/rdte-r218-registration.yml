name: Atlas to MakeHuman registration experiments
on:
  pull_request:
    branches: [rdte/r217-anatomy-hierarchy]
    paths: ['experiments/r218/register.py','.github/workflows/rdte-r218-registration.yml']
permissions:
  contents: read
  actions: read
jobs:
  register:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        sex: [male,female]
    env:
      SEX: ${{ matrix.sex }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retrieve exact qualified body and anatomy archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if test "$SEX" = male; then body=15237135134; atlas=15236391638; else body=15237095388; atlas=15237020985; fi
          gh api repos/SemperSupra/oneirifact/actions/artifacts/$body/zip > "$RUNNER_TEMP/body.zip"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/$atlas/zip > "$RUNNER_TEMP/atlas.zip"
      - name: Compare registration candidates and actual sampled containment
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install numpy==2.3.5 scipy==1.17.0 trimesh==4.6.8 Rtree==1.4.1 Pillow==12.0.0
          python experiments/r218/register.py "$RUNNER_TEMP/body.zip" "$RUNNER_TEMP/atlas.zip" "$RUNNER_TEMP/registration" "$SEX"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r218-registration-${{ matrix.sex }}
          path: ${{ runner.temp }}/registration
          retention-days: 30
          if-no-files-found: error
