name: Female CT skeletal supplement qualification
on:
  pull_request:
    branches: [rdte/r222-anatomical-baseline]
    paths: ['experiments/r222/female_skeleton.py','.github/workflows/rdte-r222-female-skeleton.yml']
permissions:
  contents: read
  actions: read
jobs:
  skeleton:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retrieve verified HRA baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/SemperSupra/oneirifact/actions/artifacts/15238269509/zip > "$RUNNER_TEMP/atlas.zip"
      - name: Acquire and independently assess full female CT skeleton
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install numpy==2.3.5 trimesh==4.6.8 Pillow==12.0.0
          python experiments/r222/female_skeleton.py "$RUNNER_TEMP/atlas.zip" "$RUNNER_TEMP/skeleton"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r222-female-skeleton
          path: ${{ runner.temp }}/skeleton
          retention-days: 30
          if-no-files-found: error
