name: Verify full anatomical baseline geometry transport
on:
  pull_request:
    branches: [rdte/r222-anatomical-baseline]
    paths: ['experiments/r223/audit.py','.github/workflows/rdte-r223-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sex: [male, female]
    env:
      SEX: ${{ matrix.sex }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retrieve exact original donor and baseline artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if test "$SEX" = male; then
            id=15238389268
            gh api repos/SemperSupra/oneirifact/actions/artifacts/15236959584/zip > "$RUNNER_TEMP/source.zip"
          else id=15238269509; fi
          gh api repos/SemperSupra/oneirifact/actions/artifacts/$id/zip > "$RUNNER_TEMP/baseline.zip"
      - name: Independent full triangle-coordinate and semantic audit
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install numpy==2.3.5 trimesh==4.6.8
          python experiments/r223/audit.py "$SEX" "$RUNNER_TEMP/baseline.zip" "$RUNNER_TEMP/source.zip" "$RUNNER_TEMP/audit"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r223-transport-audit-${{ matrix.sex }}
          path: ${{ runner.temp }}/audit
          retention-days: 30
          if-no-files-found: error
