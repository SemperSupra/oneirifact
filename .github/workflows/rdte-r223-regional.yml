name: Regional female skeletal alignment
on:
  pull_request:
    branches: [rdte/r222-female-skeleton]
    paths: ['experiments/r223/regional.py','.github/workflows/rdte-r223-regional.yml']
permissions:
  contents: read
  actions: read
jobs:
  align:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retrieve exact CT and HRA baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15238834402/zip > "$RUNNER_TEMP/ct.zip"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15238269509/zip > "$RUNNER_TEMP/hra.zip"
      - name: Evaluate regional alignment and render actual geometry
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install numpy==2.3.5 trimesh==4.6.8 Pillow==12.0.0
          python experiments/r223/regional.py "$RUNNER_TEMP/ct.zip" "$RUNNER_TEMP/hra.zip" "$RUNNER_TEMP/regional"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r223-regional-skeleton
          path: ${{ runner.temp }}/regional
          retention-days: 30
          if-no-files-found: error
