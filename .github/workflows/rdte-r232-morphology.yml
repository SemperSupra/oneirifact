name: R232 editable adult female morphology and posture
on:
  pull_request:
    branches: [rdte/r219-anatomical-rig]
    paths: ['experiments/r232/**','.github/workflows/rdte-r232-morphology.yml']
permissions:
  contents: read
jobs:
  morphology:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retrieve exact CC0 upstream adult morphology and rig source
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/input"
          cd "$RUNNER_TEMP/input"
          root=https://raw.githubusercontent.com/makehumancommunity/makehuman/a8bc2d54ff0ac92e78ff71431b1023eda42bf482
          get() { curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --max-redirs 3 --max-time 60 --max-filesize 16000000 "$root/$1" -o "$2"; }
          get makehuman/data/3dobjs/base.obj base.obj
          get LICENSE.md LICENSE.md
          get LICENSE.ASSETS.md LICENSE.ASSETS.md
          for age in young old; do
            for anchor in african asian caucasian; do
              name="$anchor-female-$age"
              get "makehuman/data/targets/macrodetails/$name.target" "$name.target"
            done
            for pair in maxmuscle-averageweight maxmuscle-minweight averagemuscle-minweight; do
              name="universal-female-$age-$pair"
              get "makehuman/data/targets/macrodetails/$name.target" "$name.target"
            done
          done
          for name in torso-scale-depth-incr torso-scale-horiz-incr torso-scale-vert-incr torso-vshape-incr; do
            get "makehuman/data/targets/torso/$name.target" "$name.target"
          done
          for name in default.mhskel default_weights.mhw; do
            get "makehuman/data/rigs/$name" "$name"
          done
      - name: Generate actual adult models, refit rig, exercise editable controls
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install numpy==2.3.5 scipy==1.17.0 trimesh==4.6.8 Pillow==12.0.0
          python experiments/r232/morphology.py "$RUNNER_TEMP/input" "$RUNNER_TEMP/morphology"
          python experiments/r232/morphology.py "$RUNNER_TEMP/input" "$RUNNER_TEMP/replay" --spec "$RUNNER_TEMP/morphology/athletic-spec.json"
          cmp "$RUNNER_TEMP/morphology/athletic-rest.glb" "$RUNNER_TEMP/replay/custom-rest.glb"
          cmp "$RUNNER_TEMP/morphology/athletic-posed.glb" "$RUNNER_TEMP/replay/custom-posed.glb"
          echo EXACT_SPEC_REPLAY_PASS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r232-adult-female-morphology
          path: ${{ runner.temp }}/morphology
          retention-days: 30
          if-no-files-found: error
