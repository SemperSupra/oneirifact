name: R233 bounded female anatomical source acquisition
on:
  pull_request:
    branches: [rdte/r232-female-coverage-audit]
    paths: ['experiments/r233/sources.py','.github/workflows/rdte-r233-sources.yml']
permissions:
  contents: read
jobs:
  acquire:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Ingest bounded original NLM pelvic slices and inspect official donor metadata
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install Pillow==12.0.0
          python experiments/r233/sources.py "$RUNNER_TEMP/source-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r233-female-source-receipt
          path: ${{ runner.temp }}/source-evidence
          retention-days: 30
          if-no-files-found: error
