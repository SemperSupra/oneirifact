name: R234 independent live human design witness
on:
  pull_request:
    branches: [main]
    paths: ['tests/verify_live_human.py','.github/workflows/rdte-r234-live.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect exact main push and deployment outcome (read only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api 'repos/SemperSupra/oneirifact/actions/workflows/qualify.yml/runs?branch=main&event=push&per_page=10' --jq '.workflow_runs[] | {id,head_sha,status,conclusion,html_url}'
          id="$(gh api 'repos/SemperSupra/oneirifact/actions/workflows/qualify.yml/runs?branch=main&event=push&per_page=10' --jq '.workflow_runs[] | select(.head_sha=="a895859a4b4af87a9a6b004f6da91b8114158d89") | .id' | head -1)"
          if test -n "$id"; then
            gh api "repos/SemperSupra/oneirifact/actions/runs/$id/jobs" --jq '.jobs[] | {id,name,status,conclusion,failed:[.steps[] | select(.conclusion=="failure") | .name]}'
          else
            echo "EXACT_MAIN_PUSH_RUN_NOT_FOUND"
          fi
      - name: Independently verify the exact released archive bytes, site and routes
        run: python3 tests/verify_live_human.py "$RUNNER_TEMP/live-human-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r234-live-human-design-receipt
          path: ${{ runner.temp }}/live-human-receipt.json
          retention-days: 30
          if-no-files-found: error
