name: R237 layer dependency transactions
on:
  pull_request:
    branches: [rdte/r236-coupled-layer-fixture]
    paths: ['experiments/r236coupling/**','.github/workflows/rdte-r237-dependencies.yml']
permissions:
  contents: read
jobs:
  qualify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GO111MODULE: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Qualify exact changed and reused layer sets
        working-directory: experiments/r236coupling
        run: |
          set -euo pipefail
          go version
          gofmt -w *.go
          go vet
          go test -race -count=3 -v
          DEPENDENCY_OUTPUT="$RUNNER_TEMP/dependencies" go test -count=1 -run '^TestLayerRevisionTransactions$' -v
          sha256sum "$RUNNER_TEMP/dependencies/"*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r237-layer-dependencies
          path: ${{ runner.temp }}/dependencies
          retention-days: 30
          if-no-files-found: error
