name: R240 actual skin deformation comparison
on:
  pull_request:
    branches: [rdte/r239-fullweight-animated-human]
    paths: ['experiments/r240/deformation/**','.github/workflows/rdte-r240-deformation.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  deformation:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore actual full-weight adult models and compare deformation
        run: |
          set -euo pipefail
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15260769266/zip > "$RUNNER_TEMP/skin.zip"
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install numpy==2.3.5 scipy==1.17.0 Pillow==12.0.0
          python experiments/r240/deformation/compare.py "$RUNNER_TEMP/skin.zip" "$RUNNER_TEMP/deformation"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r240-skin-deformation-comparison
          path: ${{ runner.temp }}/deformation
          retention-days: 30
          if-no-files-found: error
