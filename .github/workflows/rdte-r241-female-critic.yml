name: R241 female anatomical orientation and penetration critic
on:
  pull_request:
    branches: [rdte/r240-registration-roll-critic]
    paths: ['experiments/r241/female/**','.github/workflows/rdte-r241-female-critic.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  female:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore four exact previous products
        run: |
          set -euo pipefail
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15262795704/zip > "$RUNNER_TEMP/base.zip"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15262026648/zip > "$RUNNER_TEMP/roll.zip"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15260769266/zip > "$RUNNER_TEMP/skin.zip"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15261653436/zip > "$RUNNER_TEMP/ct.zip"
      - name: Measure actual surface penetration and produce source-axis candidate
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install numpy==2.3.5 scipy==1.17.0 trimesh==4.6.8 Pillow==12.0.0 rtree==1.4.1
          python experiments/r241/female/critic.py "$RUNNER_TEMP/base.zip" "$RUNNER_TEMP/roll.zip" "$RUNNER_TEMP/skin.zip" "$RUNNER_TEMP/ct.zip" "$RUNNER_TEMP/female"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r241-female-penetration-critic
          path: ${{ runner.temp }}/female
          retention-days: 30
          if-no-files-found: error
