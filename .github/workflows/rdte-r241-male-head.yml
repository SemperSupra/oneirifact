name: R241 male femoral-head patch critic
on:
  pull_request:
    branches: [rdte/r241-male-anatomical-registration]
    paths: ['experiments/r241/male_head/**','.github/workflows/rdte-r241-male-head.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  head:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore exact male anatomical source
        run: |
          set -euo pipefail
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15238389268/zip > "$RUNNER_TEMP/atlas.zip"
      - name: Compare actual broad and medial-contact head patches
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install numpy==2.3.5 scipy==1.17.0 trimesh==4.6.8 Pillow==12.0.0 rtree==1.4.1
          python experiments/r241/male_head/critic.py "$RUNNER_TEMP/atlas.zip" "$RUNNER_TEMP/head"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r241-male-head-patch-critic
          path: ${{ runner.temp }}/head
          retention-days: 30
          if-no-files-found: error
