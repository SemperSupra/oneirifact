name: R242 female source relationship diagnosis
on:
  pull_request:
    branches: [rdte/r241-ct-orientation-critic]
    paths: ['experiments/r242/female/**', '.github/workflows/rdte-r242-female.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  female:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Restore exact public anatomical products
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15262795704/zip > "$RUNNER_TEMP/base.zip"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15262026648/zip > "$RUNNER_TEMP/roll.zip"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15260769266/zip > "$RUNNER_TEMP/skin.zip"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15261653436/zip > "$RUNNER_TEMP/ct.zip"
      - name: Diagnose preserved donor relations and skin sections
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install numpy==2.3.5 scipy==1.17.0 trimesh==4.6.8 Pillow==12.0.0 rtree==1.4.1
          python experiments/r242/female/relationships.py "$RUNNER_TEMP/base.zip" "$RUNNER_TEMP/roll.zip" "$RUNNER_TEMP/skin.zip" "$RUNNER_TEMP/ct.zip" "$RUNNER_TEMP/female"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node24
        if: always()
        with:
          name: r242-female-source-relationship-diagnostic
          path: ${{ runner.temp }}/female
          retention-days: 30
          if-no-files-found: error
