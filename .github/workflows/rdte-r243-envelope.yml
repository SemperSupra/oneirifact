name: R243 actual same-source exterior inventory
on:
  pull_request:
    branches: [rdte/r222-anatomical-baseline]
    paths: ['experiments/r243/envelope/**', '.github/workflows/rdte-r243-envelope.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  envelope:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Restore exact public source atlas
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15238389268/zip > "$RUNNER_TEMP/atlas.zip"
      - name: Inspect actual source surfaces and closed-envelope geometry
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install numpy==2.3.5 scipy==1.17.0 trimesh==4.6.8 Pillow==12.0.0 rtree==1.4.1
          python experiments/r243/envelope/envelope.py "$RUNNER_TEMP/atlas.zip" "$RUNNER_TEMP/envelope"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r243-actual-source-envelope-inspection
          path: ${{ runner.temp }}/envelope
          retention-days: 30
          if-no-files-found: error
