name: R243 female source ankle proxy falsifier
on:
  pull_request:
    branches: [rdte/r242-female-relationship-diagnostic]
    paths: ['experiments/r243/female/**', '.github/workflows/rdte-r243-female-ankle.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ankle-source:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Restore exact public donor and relationship evidence
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15261653436/zip > "$RUNNER_TEMP/ct.zip"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15263481874/zip > "$RUNNER_TEMP/diagnostic.zip"
      - name: Replay source-only ankle hypothesis and preserve geometric witness
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install numpy==2.3.5 scipy==1.17.0 trimesh==4.6.8 Pillow==12.0.0
          python experiments/r243/female/ankle_proxy.py "$RUNNER_TEMP/ct.zip" "$RUNNER_TEMP/diagnostic.zip" "$RUNNER_TEMP/ankle"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node24
        if: always()
        with:
          name: r243-female-source-ankle-falsifier
          path: ${{ runner.temp }}/ankle
          retention-days: 30
          if-no-files-found: error
