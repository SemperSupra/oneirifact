name: R245 actual reusable activity Blender consumer
on:
  pull_request:
    branches: [rdte/r245-reusable-motion]
    paths: ['experiments/r245/consumer/**', 'experiments/r245/review/critic.py', 'experiments/r245/review/analytic_oracles.py', '.github/workflows/rdte-r245-consumer.yml']
permissions:
  contents: read
  actions: read
jobs:
  consumer:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [male155flat, male155stiletto, male185flat, male185stiletto, female155flat, female155stiletto, female185flat, female185stiletto, maleolderflat]
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and prepare post-morphology bind
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15260769266/zip > "$RUNNER_TEMP/source.zip"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15258079477/zip > "$RUNNER_TEMP/shared.zip"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install numpy==2.3.5 scipy==1.17.0 Pillow==12.0.0
          "$RUNNER_TEMP/venv/bin/python" experiments/r245/consumer/prepare.py "$RUNNER_TEMP/source.zip" "$RUNNER_TEMP/shared.zip" "$RUNNER_TEMP/product" "${{ matrix.case }}"
          python3 experiments/r245/review/analytic_oracles.py > "$RUNNER_TEMP/product/critic-analytic-oracles.json"
      - name: Actual native pose, immutable shoe geometry, render, save and interchange replay
        run: |
          set -euo pipefail
          archive=blender-5.2.4-linux-x64.tar.xz
          expected=2fd14c50987426897ba60237ee996edf2b4151f4b1a72a460ca20be58c1d2d86
          blender_root="$RUNNER_TEMP/blender"
          mkdir "$blender_root"
          for origin in https://download.blender.org https://mirror.blender.org https://mirror.nju.edu.cn/blender; do
            if timeout 110s curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --connect-timeout 12 --max-time 95 "$origin/release/Blender5.2/$archive" -o "$blender_root/$archive"; then
              echo "$expected  $blender_root/$archive" | sha256sum -c -
              break
            fi
          done
          echo "$expected  $blender_root/$archive" | sha256sum -c -
          timeout 150s tar -xf "$blender_root/$archive" -C "$blender_root"
          "$blender_root/blender-5.2.4-linux-x64/blender" -b --factory-startup --threads 2 --python-exit-code 1 --python experiments/r245/consumer/witness.py -- "$RUNNER_TEMP/product"
      - name: Independent actual contact and rigidity critics, with review images and MP4 products
        if: always()
        run: |
          set -euo pipefail
          for phase in native-ik reopened-blend consumer; do
            input="$RUNNER_TEMP/product/$phase-observations.json"
            if test -f "$input"; then
              python3 experiments/r245/review/critic.py "$input" "$RUNNER_TEMP/product/independent-critic-$phase.json"
            fi
          done
          if test -f "$RUNNER_TEMP/product/case.json"; then
            "$RUNNER_TEMP/venv/bin/python" experiments/r245/consumer/finish.py "$RUNNER_TEMP/product"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 Node24
        if: always()
        with:
          name: r245-${{ matrix.case }}-actual-activity-consumer
          path: ${{ runner.temp }}/product
          retention-days: 30
          if-no-files-found: error
