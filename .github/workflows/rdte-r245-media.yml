name: R245 actual render video packaging recovery
on:
  pull_request:
    branches: [rdte/r245-actual-motion-consumer]
    paths: ['experiments/r245/media/**', '.github/workflows/rdte-r245-media.yml']
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - case: male155flat
            artifact: 15265894858
            sha256: 3b81ef5c4c036cde264a068478db50c729682540c667d26ef6c50a0aad293ba6
          - case: male185stiletto
            artifact: 15265568562
            sha256: 5786805157f5765488317184793415a770c203c9f840098fbc3da10f96a2a07d
          - case: female155stiletto
            artifact: 15266700090
            sha256: 18457d3f3a48c959158d46878b956c293c80eb023d8b2159da7471cf30c5f53e
          - case: female185flat
            artifact: 15265713811
            sha256: b1282e1fc47b8c088213058d866e202db019aebf54cfa4bf7d495cffe56d63a0
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify preserved producer archive and explicit bundled encoder wheel
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/${{ matrix.artifact }}/zip > "$RUNNER_TEMP/source.zip"
          python3 -m venv "$RUNNER_TEMP/venv"
          mkdir "$RUNNER_TEMP/wheels"
          "$RUNNER_TEMP/venv/bin/pip" download --no-deps --only-binary=:all: imageio-ffmpeg==0.6.0 -d "$RUNNER_TEMP/wheels"
          wheel="$RUNNER_TEMP/wheels/imageio_ffmpeg-0.6.0-py3-none-manylinux2014_x86_64.whl"
          echo "c7e46fcec401dd990405049d2e2f475e2b397779df2519b544b8aab515195282  $wheel" | sha256sum -c -
          "$RUNNER_TEMP/venv/bin/pip" install "$wheel" Pillow==12.0.0
      - name: Encode actual render frames and independently decode the complete videos
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" experiments/r245/media/package.py "$RUNNER_TEMP/source.zip" "${{ matrix.sha256 }}" "${{ matrix.artifact }}" "$RUNNER_TEMP/product"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: r245-${{ matrix.case }}-actual-video-product
          path: ${{ runner.temp }}/product
          retention-days: 30
          if-no-files-found: error
