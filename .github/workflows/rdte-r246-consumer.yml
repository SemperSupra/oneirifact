name: R246 actual aquatic Blender consumer
on:
  pull_request:
    branches: [rdte/r246-aquatic-activity-intent]
    paths: ['experiments/r246/consumer/**', '.github/workflows/rdte-r246-consumer.yml']
permissions:
  contents: read
  actions: read
jobs:
  consumer:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [male155flat, female185flat]
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact aquatic input custody and encoder dependency
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15266855834/zip > "$RUNNER_TEMP/aquatic-intent.zip"
          python3 experiments/r246/consumer/prepare.py "$RUNNER_TEMP/aquatic-intent.zip" "${{ matrix.case }}" "$RUNNER_TEMP/product"
          python3 -m venv "$RUNNER_TEMP/venv"
          mkdir "$RUNNER_TEMP/wheels"
          "$RUNNER_TEMP/venv/bin/pip" download --no-deps --only-binary=:all: imageio-ffmpeg==0.6.0 -d "$RUNNER_TEMP/wheels"
          wheel="$RUNNER_TEMP/wheels/imageio_ffmpeg-0.6.0-py3-none-manylinux2014_x86_64.whl"
          echo "c7e46fcec401dd990405049d2e2f475e2b397779df2519b544b8aab515195282  $wheel" | sha256sum -c -
          "$RUNNER_TEMP/venv/bin/pip" install "$wheel" Pillow==12.0.0
      - name: Actual native aquatic poses, renders, saved scene and body GLB replay
        run: |
          set -euo pipefail
          archive=blender-5.2.4-linux-x64.tar.xz
          expected=2fd14c50987426897ba60237ee996edf2b4151f4b1a72a460ca20be58c1d2d86
          blender_root="$RUNNER_TEMP/blender"
          mkdir "$blender_root"
          for origin in https://download.blender.org https://mirror.blender.org https://mirror.nju.edu.cn/blender; do
            if timeout 110s curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --connect-timeout 12 --max-time 95 "$origin/release/Blender5.2/$archive" -o "$blender_root/$archive"; then
              echo "$expected  $blender_root/$archive" | sha256sum -c -
              break
            fi
          done
          echo "$expected  $blender_root/$archive" | sha256sum -c -
          timeout 150s tar -xf "$blender_root/$archive" -C "$blender_root"
          "$blender_root/blender-5.2.4-linux-x64/blender" -b --factory-startup --threads 2 --python-exit-code 1 --python experiments/r246/consumer/witness.py -- "$RUNNER_TEMP/product"
      - name: Independent observed aquatic critics
        if: always()
        run: |
          set -euo pipefail
          for phase in native-ik reopened-blend consumer; do
            input="$RUNNER_TEMP/product/$phase-observations.json"
            if test -f "$input"; then
              python3 experiments/r246/consumer/native_critic.py "$input" "$RUNNER_TEMP/product/native-critic-$phase.json"
            fi
          done
          if test -f "$RUNNER_TEMP/product/native-ik-observations.json"; then
            python3 experiments/r246/consumer/native_oracles.py "$RUNNER_TEMP/product/native-ik-observations.json" "$RUNNER_TEMP/product/native-critic-analytic-oracles.json"
          fi
      - name: Encode, fully decode and package actual rendered products
        if: always()
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/product/consumer-receipt.json"; then
            "$RUNNER_TEMP/venv/bin/python" experiments/r246/consumer/finish.py "$RUNNER_TEMP/product"
          fi
      - name: Require complete transport and bounded observed gates
        if: always()
        run: |
          set -euo pipefail
          python3 experiments/r246/consumer/qualification.py "$RUNNER_TEMP/product"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 Node24
        if: always()
        with:
          name: r246-${{ matrix.case }}-actual-aquatic-consumer
          path: ${{ runner.temp }}/product
          retention-days: 30
          if-no-files-found: error
