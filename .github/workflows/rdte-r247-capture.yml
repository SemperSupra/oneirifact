name: R247 actual captured-motion donor bakeoff
on:
  pull_request:
    branches: [rdte/r245-actual-motion-consumer]
    paths: ['experiments/r247/**', '.github/workflows/rdte-r247-capture.yml']
permissions:
  contents: read
  actions: read
jobs:
  retarget:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [male155flat, male185flat]
        capture: ['07_01', '13_01']
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify qualified source intake and prepare exact post-morphology model
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15266376154/zip > "$RUNNER_TEMP/captures.zip"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15260769266/zip > "$RUNNER_TEMP/source.zip"
          gh api repos/SemperSupra/oneirifact/actions/artifacts/15258079477/zip > "$RUNNER_TEMP/shared.zip"
          python3 -m venv "$RUNNER_TEMP/venv"
          mkdir "$RUNNER_TEMP/wheels"
          "$RUNNER_TEMP/venv/bin/pip" download --no-deps --only-binary=:all: imageio-ffmpeg==0.6.0 -d "$RUNNER_TEMP/wheels"
          wheel="$RUNNER_TEMP/wheels/imageio_ffmpeg-0.6.0-py3-none-manylinux2014_x86_64.whl"
          echo "c7e46fcec401dd990405049d2e2f475e2b397779df2519b544b8aab515195282  $wheel" | sha256sum -c -
          "$RUNNER_TEMP/venv/bin/pip" install "$wheel" numpy==2.3.5 scipy==1.17.0 Pillow==12.0.0
          "$RUNNER_TEMP/venv/bin/python" experiments/r245/consumer/prepare.py "$RUNNER_TEMP/source.zip" "$RUNNER_TEMP/shared.zip" "$RUNNER_TEMP/product" "${{ matrix.case }}"
          git clone --depth 1 --branch version_5_2_0 https://github.com/Diffeomorphic/retarget_bvh.git "$RUNNER_TEMP/retarget_bvh"
          python3 experiments/r247/capture/custody.py "$RUNNER_TEMP/captures.zip" "$RUNNER_TEMP/selected" "$RUNNER_TEMP/product" "$RUNNER_TEMP/retarget_bvh"
      - name: Actual pinned Blender capture retarget, CPU render, save and independent replay
        run: |
          set -euo pipefail
          archive=blender-5.2.4-linux-x64.tar.xz
          expected=2fd14c50987426897ba60237ee996edf2b4151f4b1a72a460ca20be58c1d2d86
          blender_root="$RUNNER_TEMP/blender"
          mkdir "$blender_root"
          for origin in https://download.blender.org https://mirror.blender.org https://mirror.nju.edu.cn/blender; do
            if timeout 110s curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --connect-timeout 12 --max-time 95 "$origin/release/Blender5.2/$archive" -o "$blender_root/$archive"; then
              echo "$expected  $blender_root/$archive" | sha256sum -c -
              break
            fi
          done
          echo "$expected  $blender_root/$archive" | sha256sum -c -
          timeout 150s tar -xf "$blender_root/$archive" -C "$blender_root"
          "$blender_root/blender-5.2.4-linux-x64/blender" -b --factory-startup --threads 2 --python-exit-code 1 --python experiments/r247/capture/witness.py -- "$RUNNER_TEMP/product" "$RUNNER_TEMP/selected" "$RUNNER_TEMP/retarget_bvh" "${{ matrix.capture }}"
      - name: Independent capture/contact critic and fully decoded video products
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" experiments/r247/capture/critic.py "$RUNNER_TEMP/product"
          "$RUNNER_TEMP/venv/bin/python" experiments/r247/capture/package.py "$RUNNER_TEMP/product"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 Node24
        if: always()
        with:
          name: r247-${{ matrix.case }}-cmu-${{ matrix.capture }}-captured-motion
          path: ${{ runner.temp }}/product
          retention-days: 30
          if-no-files-found: error
